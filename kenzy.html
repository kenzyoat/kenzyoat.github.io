<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>specialone Profil</title>
<style>
  * { box-sizing: border-box; }
  body, html {
    margin: 0; padding: 0;
    height: 100%; width: 100%;
    font-family: 'Arial', sans-serif;
    display: flex; justify-content: center; align-items: center;
    color: white; position: relative; overflow: hidden;
  }

  /* Video arka plan */
  #background-video {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    object-fit: cover;
    z-index: -2;
  }

  body::before {
    content:"";
    position:absolute; top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.4);
    z-index: -1;
  }

  .profile-card {
    background: rgba(0,0,0,0.45);
    border-radius: 30px;
    padding: 50px 70px;
    text-align: center;
    box-shadow: 0 0 30px 20px rgba(0,0,0,0.8);
    transition: transform .4s ease, box-shadow .4s ease;
    z-index: 1;
  }

  .profile-card:hover{ transform: translateY(-15px) scale(1.02); box-shadow:0 25px 50px rgba(0,0,0,0.9); }
  .profile-card img{ width:150px; height:150px; border-radius:50%; border:4px solid #fff; transition: transform .4s ease; }
  .username{ font-size:34px; color:#b39ddb; margin-top:15px; font-weight:bold; animation: colorChange 4s infinite alternate; }
  .bio{ font-size:18px; color:#d3d3d3; margin-top:10px; animation: fadeIn 2s ease-in-out; text-shadow:0 0 5px rgba(255,255,255,0.3); }
  .social-icons{ margin-top:30px; display:flex; justify-content:center; gap:15px; flex-wrap:wrap; }
  .social-icons a{ color:white; text-decoration:none; font-size:28px; transition: transform .3s, color .3s; }
  .social-icons a:hover{ transform: scale(1.5) rotate(-10deg); color:#b39ddb; }

  /* Buton stili */
  #play-button {
    position: fixed;
    top: 20px; left: 20px;
    padding: 12px 20px;
    font-size: 16px;
    background: #b39ddb;
    border: none;
    border-radius: 12px;
    color: white;
    cursor: pointer;
    z-index: 2;
    box-shadow: 0 5px 15px rgba(0,0,0,0.4);
    transition: transform .2s, background .2s;
  }

  #play-button:hover {
    background: #ff79c6;
    transform: scale(1.1);
  }

  @keyframes colorChange { 0%{color:#b39ddb} 50%{color:#ff79c6} 100%{color:#8be9fd} }
  @keyframes fadeIn { 0%{opacity:0; transform:translateY(20px)} 100%{opacity:1; transform:translateY(0)} }

</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<video id="background-video" autoplay loop muted>
  <source src="suzuya.mp4" type="video/mp4">
  Tarayıcınız video etiketini desteklemiyor.
</video>

<audio id="background-audio" loop>
  <source src="suzuya3.mp3" type="audio/mp3">
</audio>

<button id="play-button">open music</button>

<div class="profile-card">
    <img src="https://i.pinimg.com/236x/b6/ff/67/b6ff6759bae97649ca0fb676086e9f61.jpg" alt="Profil Resmi">
    <div class="username">Kenzy</div>
    <div class="bio">dark triad</div>

    <div class="social-icons">
        <a href="https://www.instagram.com/kenzyoat/" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="https://discord.com/users/kenzyoat" target="_blank"><i class="fab fa-discord"></i></a>
        <a href="https://open.spotify.com/user/31mlfqjzm6m5l4wbz2oc2bx6wkea?si=4ca9efac1acf41d3" target="_blank"><i class="fab fa-spotify"></i></a>
        <a href="https://www.tiktok.com/@kenzyoat" target="_blank"><i class="fab fa-tiktok"></i></a>
    </div>
</div>

<script>
  const audio = document.getElementById('background-audio');
  const button = document.getElementById('play-button');

  button.addEventListener('click', () => {
    audio.play();
    button.style.display = 'none'; // buton kaybolur
  });
</script>

</body>
</html>
